<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    interactive-widget=resizes-visual: tells Chrome/Android to keep the
    LAYOUT viewport (what this app's pinned height and fixed positioning
    are based on) stable when the on-screen keyboard opens, so the footer
    doesn't rise to fit above it -- while still letting
    window.visualViewport shrink to the actually-visible area, which
    js/ui/keyboardScroll.js needs to detect the keyboard at all and know
    how much of a focused field it's covering. `overlays-content` (tried
    first) turned out to suppress that visualViewport shrink too, which
    broke keyboard-aware scrolling entirely -- this value is the one that
    satisfies both needs at once. Ignored (harmless) on browsers that
    don't recognize it; see styles.css's 100lvh usage for the equivalent
    stable-layout fix on those (mainly Safari, which already lets
    visualViewport shrink for the keyboard on its own).
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Blissful Budget" />
  <title>Blissful Budget Expense Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Pins the app's height to a plain JS-captured pixel value (via the
    // --app-height custom property styles.css reads) instead of a CSS
    // viewport unit -- CSS vh/%/lvh all turned out to still shrink for
    // the on-screen keyboard on at least one major mobile browser, which
    // dragged this fixed-height layout (footer included) up to fit above
    // the keyboard instead of staying full-size and being covered by it.
    // A resize is only treated as real (device rotation, browser window
    // resize) and allowed to update the captured height when the WIDTH
    // also changed -- the keyboard opening/closing only ever changes
    // height, so those are deliberately ignored, leaving the layout
    // exactly where it was before the keyboard appeared.
    (function () {
      function currentSize() {
        var vv = window.visualViewport;
        return { width: (vv && vv.width) || window.innerWidth, height: (vv && vv.height) || window.innerHeight };
      }
      var last = currentSize();
      function setAppHeight() {
        document.documentElement.style.setProperty("--app-height", last.height + "px");
      }
      setAppHeight();
      function handleResize() {
        var size = currentSize();
        if (size.width !== last.width) {
          last = size;
          setAppHeight();
        }
      }
      window.addEventListener("resize", handleResize);
      window.addEventListener("orientationchange", function () {
        setTimeout(handleResize, 100);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", handleResize);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.14.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <div class="phone-frame" id="app">
    <!--
      Persistent chrome -- mirrors BlissfulBudgetNavHost.kt: rendered once,
      never re-created as the active screen changes, so it never "flashes"
      or re-animates on navigation.
    -->
    <header class="app-header">
      <span class="app-header__title">BLISSFUL BUDGET</span>
      <button class="app-header__close" id="header-close-button" aria-label="Close" type="button"></button>
    </header>

    <div class="app-title-row">
      <span class="app-title-row__text">EXPENSE LOG</span>
      <img class="app-title-row__logo" src="icons/logo_bb.png" alt="" />
    </div>

    <div class="progress-row" id="progress-row">
      <div class="progress-col progress-col--access-file">
        <div class="progress-col__icon" id="progress-icon-access-file"></div>
        <div class="progress-col__label">ACCESS<br />FILE</div>
      </div>
      <div class="progress-gap-16"></div>
      <div class="progress-arrow" id="progress-arrow-1"></div>
      <div class="progress-gap-14"></div>
      <div class="progress-col progress-col--choose-month">
        <div class="progress-col__icon" id="progress-icon-choose-month"></div>
        <div class="progress-col__label">CHOOSE MONTH</div>
      </div>
      <div class="progress-gap-10"></div>
      <div class="progress-arrow" id="progress-arrow-2"></div>
      <div class="progress-gap-10"></div>
      <div class="progress-col progress-col--log-expense" style="margin-left: -3px;">
        <div class="progress-col__icon" id="progress-icon-log-expense"></div>
        <div class="progress-col__label">LOG EXPENSE</div>
      </div>
    </div>

    <main id="screen-container">
      <!-- Screens are injected here by js/app.js -->
    </main>

    <footer class="app-footer">
      <div class="app-footer__divider"></div>
      <div class="app-footer__band" id="footer-band"></div>
    </footer>
  </div>

  <!-- OneDrive picker dialog -- shared shell, filled in by chooseSpreadsheet.js -->
  <div class="bb-dialog-backdrop" id="onedrive-dialog-backdrop">
    <div class="bb-dialog-card" id="onedrive-dialog-card"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/ui/scrollLock.js"></script>
  <script src="js/ui/keyboardScroll.js"></script>
  <script src="js/ui/dropdown.js"></script>
  <script src="js/screens/chooseSpreadsheet.js"></script>
  <script src="js/screens/selectMonth.js"></script>
  <script src="js/screens/expenseInformation.js"></script>
  <script src="js/screens/expenseLogged.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
